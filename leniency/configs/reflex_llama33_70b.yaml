# Reflex study (PREREGISTRATION.md): neutral framing, identical payoffs. The legal-framing
# comparison cells are the matching cells (same seeds, supergames 0-19) of the baseline/screen run.
# Agents vary; authority and classifier stay on gpt-4.1-mini (T=0) so the instrument is fixed.
experiment: {name: reflex_llama33_70b, supergames: 20, periods: 20, history_window: 40, seed: 0, concurrency: 20, max_inflight_calls: 40, max_parse_retries: 8}
models:
  agent_a:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 1.0
    max_tokens: 400
    extra_body: {provider: {order: [DeepInfra], allow_fallbacks: false}}
  authority: {model: openai/gpt-4.1-mini, temperature: 0, max_tokens: 400}
  classifier: {model: openai/gpt-4.1-mini, temperature: 0, max_tokens: 400}
conditions:
  - {regime: E1, framing: neutral}
