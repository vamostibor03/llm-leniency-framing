# Lee (SSRN 7426061) replication on the primary model: five regimes, every extension flag off.
# Agents: Llama-3.3-70B pinned to one OpenRouter provider (DeepInfra, fp8) so all data comes from
# the same weights. Authority and classifier stay on gpt-4.1-mini (T=0), as in every other run.
experiment: {name: lee_llama33_70b, supergames: 30, periods: 20, history_window: 40, seed: 0, concurrency: 25, max_inflight_calls: 48}
models:
  agent_a:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 1.0
    max_tokens: 400
    extra_body: {provider: {order: [DeepInfra], allow_fallbacks: false}}
  authority: {model: openai/gpt-4.1-mini, temperature: 0, max_tokens: 400}
  classifier: {model: openai/gpt-4.1-mini, temperature: 0, max_tokens: 400}
conditions: [E0, E1, E2, E3a, E3b]
