# Model screen: does this family collude at E0 and show an incentive-sensitive report ladder?
# Agents vary; authority and classifier stay on gpt-4.1-mini (T=0) so the instrument is fixed.
# Reasoning cannot be disabled on this endpoint; minimal effort measured 0 reasoning tokens.
experiment: {name: screen_gemini35fl, supergames: 10, periods: 20, history_window: 40, seed: 0, concurrency: 10, max_inflight_calls: 32, max_parse_retries: 8}
models:
  agent_a:
    model: google/gemini-3.5-flash-lite
    temperature: 1.0
    max_tokens: 400
    extra_body: {reasoning: {effort: minimal}}
  authority: {model: openai/gpt-4.1-mini, temperature: 0, max_tokens: 400}
  classifier: {model: openai/gpt-4.1-mini, temperature: 0, max_tokens: 400}
conditions: [E0, E1, E3b]
