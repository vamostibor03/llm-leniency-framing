[project]
name = "leniency"
version = "0.1.0"
description = "LLM leniency/reward experiment: a faithful, extensible harness of Lee (SSRN 7426061) on the Bigoni et al. (2012) duopoly"
requires-python = ">=3.10"
# The engine and the HTTP backend use only the standard library (urllib); no openai SDK needed.
dependencies = [
    "pyyaml>=6",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
leniency = "leniency.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leniency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
